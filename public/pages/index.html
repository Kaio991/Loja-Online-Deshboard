<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja Full Stack</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <div id="user-greeting">
            <span>Seja bem-vindo, <strong id="user-name">Visitante</strong></span>
        </div>

        <div class="header-right">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Buscar produtos...">
                <button id="search-btn">🔍</button>
            </div>

            <a href="carrinho.html" id="carrinho-link">
                <div id="carrinho-icon">
                    <span class="emoji">🛒</span>
                    <span id="carrinho-count">0</span>
                </div>
            </a>

            <div id="auth-buttons">
            </div>
        </div>
    </header>

    <main>
        <div class="title-container">
            <h1 class="main-title">Nossos Produtos</h1>
        </div>

        <div id="lista-produtos" class="produtos-grid">
            <p class="loading-text">Carregando produtos...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/carrinho.js"></script>
    <script src="../js/index.js"></script>

</body>

</html>
